name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write

# One run per ref: stacked pushes otherwise pile up in the runner queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
        exclude:
          # GitHub's hosted macOS pool is oversubscribed: three queued macOS legs
          # sat for hours while the Linux and Windows legs finished in under a
          # minute. One macOS leg still exercises the darwin-only code (diskutil,
          # `mount`, /dev/rdisk* globs) for real at runtime; language-version
          # coverage is carried by the other two operating systems.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}

    # The macOS leg has sat in GitHub's hosted macOS queue for hours at a time
    # without ever starting. Failing the whole matrix on that would mean no
    # release can ship while the runner pool is saturated, so macOS is
    # non-blocking until it has run at least once. Flip this to `false` once
    # macOS CI is green and you want it enforced.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check with pyright
        run: pyright src

      - name: Run tests
        run: pytest -v

      - name: Smoke test the installed CLI
        run: tascam-dp008ex-sd-audio-extractor --help

      - name: Real device discovery on this platform
        # Exercises the platform backends for real, not just the pure parsers:
        # sysfs on Linux, diskutil + `mount` on macOS, CreateFileW/DeviceIoControl
        # on Windows. Output is in the job log.
        run: tascam-dp008ex-sd-audio-extractor devices

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
          python -m pip install dist/*.whl
          tascam-dp008ex-sd-audio-extractor --help
